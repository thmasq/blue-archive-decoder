[package]
name = "blue-archive-decoder"
version = "0.2.1"
authors = ["Thomas Q <thomasqsa@gmail.com>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/thmasq/blue-archive-decoder"
description = "Webapp for decoding Blue Archive's database file"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitvec = "1.0.1"
chrono = "0.4.44"
chumsky = "0.12.0"
console_error_panic_hook = "0.1.7"
csv = "1.4.0"
flatbuffers = { version = "25.12.19", features = ["serde", "serialize"] }
fontdue = "0.9.3"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
leptos = { version = "0.8.17", features = ["csr"] }
leptos-use = "0.18.3"
logos = "0.16.1"
paste = "1.0.15"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlite_wasm_reader = { git = "https://github.com/thmasq/sqlite-wasm-reader", tag = "v0.4.3" }
unicode-linebreak = "0.1.5"
wasm-bindgen = "0.2.115"
wasm-bindgen-futures = "0.4.65"
web-sys = { version = "0.3.92", features = ["console", "Window", "Document", "Element", "Node", "HtmlElement", "HtmlTableSectionElement", "HtmlTableRowElement", "HtmlTableCellElement", "DocumentFragment", "CssStyleDeclaration", "HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics", "FileList", "File", "FileReader", "HtmlInputElement", "Event", "DragEvent", "Blob", "BlobPropertyBag", "Url", "Performance"] }
zip = { version = "8.4.0", default-features = false, features = ["deflate", "aes-crypto"] }

[profile.release]
panic = "abort"
lto = "fat"
opt-level = 3
codegen-units = 1
